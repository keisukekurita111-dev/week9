<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ページタイトル</title>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-200"><!--min-h-screenは最低の高さを100pxにする-->
    
    <div class="rounded-lg p-12 bg-white shadow max-w-md"> <!--p-6があると箱っぽく見える、w-fullが綺麗に効く-->
    
    <form id=""><!--「この入力たちは1つの入力フォームですよ」とHTMLに伝えるタグ-->
        <label class="font-bold">name</label><!--特定の入力欄と紐づく名前を表すタグという意味-->
        <input 
        type="text" 
        class="border shadow focus:outline-none focus:ring-2 focus:ring-blue-400 rounded w-full" 
        required
        id="name"
        >   <!--border忘れない,
            requiredはHTMLの入力欄（<input>や<textarea>など）に付ける属性で、その欄への入力を必須にするもの
            focus:は「フォーカスされている時だけ、このスタイルを適用する」という条件を表す接頭辞-->

        <label class="font-bold ">adress</label><!--特定の入力欄と紐づく名前を表すタグという意味-->
        <input 
        type="email" 
        class="border shadow focus:outline-none focus:ring-2 focus:ring-blue-400 rounded w-full " 
        required
        id="mail"
        >   <!--border忘れない,
            requiredはHTMLの入力欄（<input>や<textarea>など）に付ける属性で、その欄への入力を必須にするもの
            focus:は「フォーカスされている時だけ、このスタイルを適用する」という条件を表す接頭辞-->

        <label class="font-bold">password(8文字以上)</label><!--特定の入力欄と紐づく名前を表すタグという意味-->
        <input 
        type="password" 
        class="minlength-8 shadow focus:outline-none focus:ring-2 focus:ring-blue-400 rounded w-full" 
        required
        minlength="8"
        id="password"
        >   <!--border忘れない,
            requiredはHTMLの入力欄（<input>や<textarea>など）に付ける属性で、その欄への入力を必須にするもの
            focus:は「フォーカスされている時だけ、このスタイルを適用する」という条件を表す接頭辞-->
    
        <div>
            <input type="checkbox" class="mt-4">
            <label for="agree" class="">利用規約に同意する</label>
        </div>

        <p id="massage" text-sm></p>
    </form>

    </div>

    <script>
        const form = document.querySelector("form")
        const massage = document.querySelector("massage")

        form.addEventListener("submit", (event) => {
            event.preventDefault();//一瞬でリロードしてしまうのを防ぐため

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;//passwordは空白も意味を持つのでtrimなし
            const agree = document.getElementById("agree").value.trim();

            if (name === "") {
                message.textContent = "お名前を入力してください"
                message.textContent = "text-sm font-medium"
                return;
            }//returnの後に何も返さないという意味

            if (email === "") {
                message.textContent = "メールアドレスを打ってください"
                message.textContent = "text-sm font-medium"
                return;
            }//returnの後に何も返さないという意味
        
            if (password.length < 8 ) {
                message.textContent = "パスワードを入力してください"
                message.textContent = "text-sm font-medium"
                return;
            }//returnの後に何も返さないという意味
        
            if (!agree) {
                message.textContent = "利用規約に同意してください"
                message.textContent = "text-sm font-medium"
                return;
            }//returnの後に何も返さないという意味
            
            massage.textContent = "登録完了！ようこそ、 + "name"さん！ "
            message.className = "text-sm font-medium text-green-600";
        });









    </script>
</body>
</html>
